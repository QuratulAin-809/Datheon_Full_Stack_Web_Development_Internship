<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dynamic Task Manager: create, edit, categorize, filter and reorder tasks. Saved in your browser with localStorage." />
  <title>Task Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310b981'/%3E%3Cpath d='M18 34l10 10 18-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
          <rect width="48" height="48" rx="12"></rect>
          <path d="M13 25l8 8 14-17"></path>
        </svg>
        Task Manager
      </h1>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark and light theme">🌙</button>
    </div>
  </header>

  <main class="app">
    <!-- ADD TASK -->
    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading" class="panel-title">Add a task</h2>
      <form id="task-form" class="task-form" autocomplete="off">
        <label class="field field-grow">
          <span>Task</span>
          <input id="task-input" type="text" maxlength="120" placeholder="What needs to be done?" required />
        </label>
        <label class="field">
          <span>Category</span>
          <select id="category-input">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
          </select>
        </label>
        <label class="field">
          <span>Due date</span>
          <input id="due-input" type="date" />
        </label>
        <button class="btn btn-primary" type="submit">Add task</button>
      </form>
    </section>

    <!-- TOOLBAR -->
    <section class="toolbar" aria-label="Filter and search tasks">
      <div class="filters" role="group" aria-label="Filter by status">
        <button class="chip active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="chip" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="toolbar-right">
        <label class="field field-inline">
          <span class="sr-only">Filter by category</span>
          <select id="category-filter">
            <option value="all">All categories</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
          </select>
        </label>
        <label class="field field-inline">
          <span class="sr-only">Search tasks</span>
          <input id="search-input" type="search" placeholder="Search tasks..." />
        </label>
      </div>
    </section>

    <!-- LIST -->
    <section aria-labelledby="list-heading">
      <h2 id="list-heading" class="sr-only">Your tasks</h2>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty" hidden></p>
      <div class="list-footer">
        <span id="task-count" aria-live="polite"></span>
        <button id="clear-completed" class="btn btn-small" type="button">Clear completed</button>
      </div>
      <p class="hint">Tip: drag a task by its handle, or use the arrow buttons, to change the order.</p>
    </section>
  </main>

  <footer class="footer">
    <p>Your tasks are saved in this browser (localStorage). No server needed.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
